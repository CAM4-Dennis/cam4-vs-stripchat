name: Deploy to MojoHost

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Whitelist runner IP
        run: |
          curl -sf -X POST "https://msd5362.mjhst.com/updateip.php" \
            -H "Authorization: Bearer ${{ secrets.MOJOHOST_TOKEN }}"
          echo "IP whitelisted, waiting for firewall reload..."
          sleep 5

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github*/**
            **/.gitignore
