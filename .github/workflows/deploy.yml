name: Deploy to MojoHost

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "${{ secrets.FTP_PASSWORD }}" sftp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -P 22 \
            ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} <<'EOF'
          cd public_html
          put index.html
          put privacy.html
          put favicon.svg
          put robots.txt
          put sitemap.xml
          quit
          EOF
        working-directory: ./
